name: "CI/CD Pipeline - Smart Travel Assistant IaC"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  pull-requests: write

jobs:
  code-quality:
    name: "Code Syntax & Lint Check"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax Check Lambda Handlers
        run: |
          node --check lambda/common.js
          node --check lambda/ai_ocr_service.js
          node --check lambda/slack_handler.js
          node --check lambda/reminder_cron.js
          echo "All Lambda handlers passed JavaScript syntax check!"

  terraform-validate:
    name: "Terraform Lint & Validate"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.0

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

  terraform-plan-and-apply:
    name: "Terraform Plan & Deploy"
    needs: [code-quality, terraform-validate]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: ./terraform
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.0

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Terraform Init (Cloud Backend)
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -out=tfplan
        env:
          TF_VAR_slack_bot_token: ${{ secrets.SLACK_BOT_TOKEN }}
          TF_VAR_slack_signing_secret: ${{ secrets.SLACK_SIGNING_SECRET }}
          TF_VAR_google_sheet_id: ${{ secrets.GOOGLE_SHEET_ID }}
          TF_VAR_google_service_account_json: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          TF_VAR_openrouter_api_key: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

