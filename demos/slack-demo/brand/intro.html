<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>STA intro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root { --navy:#0A2342; --navy2:#123B63; --amber:#FFB547; --teal:#3DE0C5; --ink:#F4F8FC; --mute:#9DB4CC; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--navy); }
  body { font-family: "Plus Jakarta Sans", "Segoe UI", Arial, sans-serif; color: var(--ink); position: relative;
    background: radial-gradient(1200px 800px at 78% 40%, #1A5688 0%, rgba(26,86,136,0) 60%), linear-gradient(135deg, var(--navy) 0%, var(--navy2) 100%); }
  .grid { position:absolute; inset:0; background-image: linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px); background-size: 80px 80px; animation: fade .6s ease both; }
  svg.path { position:absolute; inset:0; animation: fade .9s ease .4s both; }
  .left { position:absolute; left:150px; top:0; bottom:0; width:1000px; display:flex; flex-direction:column; justify-content:center; }
  .badge { display:inline-flex; align-items:center; gap:14px; align-self:flex-start; padding:12px 24px; border:2px solid rgba(255,181,71,.7); border-radius:999px; color:var(--amber); font-weight:700; font-size:26px; letter-spacing:6px; margin-bottom:44px; animation: slideX .5s cubic-bezier(.2,.8,.2,1) .6s both; }
  .badge i { width:12px; height:12px; border-radius:50%; background:var(--amber); display:block; }
  h1 { font-size:128px; line-height:1.02; font-weight:800; letter-spacing:-3px; }
  h1 .l { display:block; }
  h1 .l1 { animation: rise .6s cubic-bezier(.2,.8,.2,1) .8s both; }
  h1 .l2 { color: var(--amber); animation: rise .6s cubic-bezier(.2,.8,.2,1) 1.0s both; }
  .sub { margin-top:38px; font-size:42px; color:var(--mute); font-weight:500; line-height:1.35; max-width:860px; animation: rise .5s ease 1.5s both; }
  .chips { margin-top:60px; display:flex; gap:18px; }
  .chip { padding:14px 26px; border-radius:14px; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.16); font-size:26px; font-weight:700; color:var(--ink); animation: rise .45s ease both; }
  .chip:nth-child(1) { animation-delay: 1.9s } .chip:nth-child(2) { animation-delay: 2.05s } .chip:nth-child(3) { animation-delay: 2.2s }
  .chip b { color: var(--teal); }
  .logo { position:absolute; right:150px; top:50%; margin-top:-310px; width:620px; height:620px; filter: drop-shadow(0 30px 60px rgba(0,0,0,.45));
    animation: pop .8s cubic-bezier(.2,1.4,.4,1) .3s both, float 3.2s ease-in-out 1.2s infinite; }
  .halo { position:absolute; right:110px; top:50%; margin-top:-350px; width:700px; height:700px; border-radius:50%; border:2px dashed rgba(61,224,197,.35); animation: haloIn .9s ease-out .5s both; }
  .tag { position:absolute; left:150px; bottom:64px; font-size:24px; color:var(--mute); letter-spacing:2px; animation: fade .6s ease 2.4s both; }
  .plane { position:absolute; left:0; top:0; width:60px; height:60px; offset-path: path("M-40 1070 C 500 1090, 1000 1060, 1450 520 S 1800 150, 1990 70"); offset-rotate: auto 38deg; offset-distance: 0%; animation: fly 4.2s cubic-bezier(.45,.05,.55,.95) .7s both; }
  .plane svg { display:block; transform: translate(-30px,-30px); }
  .fadeout { position:absolute; inset:0; background:#0A2342; opacity:0; animation: fade 0.5s ease 4.9s both; }
  @keyframes fade { from { opacity:0 } to { opacity:1 } }
  .fadeout { animation-name: fadeOut }
  @keyframes fadeOut { from { opacity:0 } to { opacity:1 } }
  @keyframes rise { from { opacity:0; transform: translateY(46px) } to { opacity:1; transform:none } }
  @keyframes slideX { from { opacity:0; transform: translateX(-60px) } to { opacity:1; transform:none } }
  @keyframes pop { from { opacity:0; transform: scale(.5) rotate(-6deg) } to { opacity:1; transform:none } }
  @keyframes float { 0%,100% { translate: 0 0 } 50% { translate: 0 -12px } }
  @keyframes haloIn { from { opacity:0; transform: scale(.7) } to { opacity:1; transform:none } }
  @keyframes fly { from { offset-distance: 0% } to { offset-distance: 100% } }
</style></head>
<body>
  <div class="grid"></div>
  <svg class="path" viewBox="0 0 1920 1080">
    <path d="M-40 1070 C 500 1090, 1000 1060, 1450 520 S 1800 150, 1990 70" fill="none" stroke="rgba(255,181,71,.55)" stroke-width="3" stroke-dasharray="4 16" stroke-linecap="round"/>
  </svg>
  <div class="plane"><svg viewBox="-30 -30 60 60" width="60" height="60"><path d="M0 -22 L30 14 L12 10 L0 30 L-12 10 L-30 14 Z" fill="#FFB547"/></svg></div>
  <div class="halo"></div>
  <img class="logo" src="logo.svg" alt="STA bot logo">
  <div class="left">
    <div class="badge"><i></i> STA</div>
    <h1><span class="l l1">Smart Travel</span><span class="l l2">Assistant</span></h1>
    <div class="sub">Corporate travel booking, automated inside Slack.</div>
    <div class="chips">
      <div class="chip"><b>AWS</b> Serverless</div>
      <div class="chip"><b>Slack</b> Block Kit</div>
      <div class="chip"><b>Vision</b> AI OCR</div>
    </div>
  </div>
  <div class="tag">PRODUCT DEMO</div>
  <div class="fadeout"></div>
</body></html>
