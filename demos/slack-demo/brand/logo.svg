<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="head" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DCE6F2"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12395F"/>
      <stop offset="1" stop-color="#0A2342"/>
    </linearGradient>
  </defs>

  <!-- antenna with paper plane -->
  <line x1="200" y1="92" x2="200" y2="58" stroke="#C9D6E6" stroke-width="9" stroke-linecap="round"/>
  <path d="M200 20 L236 52 L214 52 L208 68 L200 56 L192 68 L186 52 L164 52 Z" fill="#FFB547" transform="rotate(18 200 46)"/>

  <!-- ears -->
  <rect x="52" y="170" width="30" height="76" rx="15" fill="#FFB547"/>
  <rect x="318" y="170" width="30" height="76" rx="15" fill="#FFB547"/>

  <!-- head -->
  <rect x="76" y="92" width="248" height="206" rx="70" fill="url(#head)"/>
  <!-- face screen -->
  <rect x="102" y="118" width="196" height="150" rx="52" fill="url(#screen)"/>

  <!-- eyes -->
  <circle cx="158" cy="190" r="15" fill="#3DE0C5"/>
  <circle cx="242" cy="190" r="15" fill="#3DE0C5"/>
  <circle cx="163" cy="185" r="4.5" fill="#FFFFFF"/>
  <circle cx="247" cy="185" r="4.5" fill="#FFFFFF"/>

  <!-- glasses -->
  <circle cx="158" cy="190" r="41" fill="#FFFFFF" fill-opacity="0.10" stroke="#FFB547" stroke-width="10"/>
  <circle cx="242" cy="190" r="41" fill="#FFFFFF" fill-opacity="0.10" stroke="#FFB547" stroke-width="10"/>
  <line x1="198" y1="186" x2="202" y2="186" stroke="#FFB547" stroke-width="10" stroke-linecap="round"/>
  <line x1="118" y1="180" x2="102" y2="172" stroke="#FFB547" stroke-width="9" stroke-linecap="round"/>
  <line x1="282" y1="180" x2="298" y2="172" stroke="#FFB547" stroke-width="9" stroke-linecap="round"/>
  <path d="M132 168 Q146 156 162 160" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="5" stroke-linecap="round"/>
  <path d="M216 168 Q230 156 246 160" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="5" stroke-linecap="round"/>

  <!-- smile -->
  <path d="M170 241 Q200 262 230 241" fill="none" stroke="#3DE0C5" stroke-width="8" stroke-linecap="round"/>

  <!-- neck + shoulders -->
  <rect x="172" y="296" width="56" height="26" rx="10" fill="#C9D6E6"/>
  <path d="M92 380 Q92 328 150 322 L250 322 Q308 328 308 380 Z" fill="#FFB547"/>
  <text x="200" y="364" text-anchor="middle" font-family="Plus Jakarta Sans, Segoe UI, Arial, sans-serif" font-weight="800" font-size="30" fill="#0A2342" letter-spacing="3">STA</text>
</svg>
